[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fastdicomstructure"
version = "0.1.0"
description = "Policy/orchestration layer on top of fastDICOMattrs' DICOM structural engine"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]
include = ["fastdicomstructure*"]
