name: CI

# This repository is a pure-Python policy/orchestration layer as of the A0
# semantic-engine extraction (see docs/architecture/
# ADR-001-ATTRS-NAMING-AND-LAYERING.md in fastDICOMattrs) -- it has no C++ of
# its own to build. Its own pyproject.toml now declares fastdicomattrs as a
# real installable dependency, pinned to the immutable, qualified public
# fastDICOMattrs v0.2.0 release (see RELEASE_PROVENANCE.md and B2c/B2d in
# docs/release/PUBLIC_REPOSITORY_HISTORY_AND_PROVENANCE.md), so CI installs
# this package normally and lets that declared dependency resolve attrs --
# the same path an external consumer uses -- rather than reconstructing the
# development-time sibling-checkout arrangement. git, a C++20 compiler, and
# CMake are required because attrs currently builds from its release tag
# rather than a prebuilt wheel; git is already guaranteed present (actions/
# checkout itself depends on it), the compiler/CMake are installed
# explicitly below since ubuntu-latest does not reliably ship them.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fastDICOMstructure
        uses: actions/checkout@v5

      - name: Install attrs build prerequisites (C++ compiler, CMake)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential cmake

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install fastDICOMstructure (resolves fastdicomattrs from its declared v0.2.0 dependency)
        run: python3 -m pip install . pytest

      - name: Report resolved dependency identity
        run: |
          python3 -c "
          import importlib.metadata as im
          import fastdicomattrs, fastdicomstructure
          print('fastdicomattrs', im.version('fastdicomattrs'), '->', fastdicomattrs.__file__)
          print('native library ->', fastdicomattrs._lib._name)
          print('fastdicomstructure', im.version('fastdicomstructure'), '->', fastdicomstructure.__file__)
          "

      - name: Test
        run: python3 -m pytest tests/python -v
